plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Hypixel'
		url = 'https://repo.hypixel.net/repository/Hypixel/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mellooessentials" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Party detection via Hypixel's official Mod API - the actual networking bridge is provided at
	// runtime by the separately-installed HypixelModAPI mod; only the packet/API classes are needed
	// here (same as SkyMelloo).
	implementation "net.hypixel:mod-api:${project.hypixel_modapi_version}"
}

// Mirrors SkyMelloo's build.gradle, own key/token/endpoint (~/.mellooessentials-signing/,
// /api/mod/mellooessentials/*) - independent, not shared with skymelloo's pipeline.
def buildType = project.hasProperty('testBuild') ? 'test' : 'dev'

// Target deployment for both the built jar and the scripts that register it - see site_url in
// gradle.properties. -PsiteUrl wins over the committed default so a dev target is never committed.
def siteUrl = (project.findProperty('siteUrl') ?: project.site_url).toString().replaceAll('/+$', '')
def productionUrl = 'https://sky.melloo.me'

processResources {
	def version = project.version
	def publicVersion = project.public_version
	inputs.property "version", version
	inputs.property "publicVersion", publicVersion
	inputs.property "buildType", buildType
	inputs.property "siteUrl", siteUrl
	filesMatching("fabric.mod.json") {
		expand "version": version, "publicVersion": publicVersion, "buildType": buildType, "siteUrl": siteUrl
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Embeds the LICENSE file in the built jar (as LICENSE_mellooessentials) - matches SkyMelloo,
// required for AGPL compliance when the jar is conveyed on its own.
jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

def resolveChangelogText = {
	if (project.hasProperty('changelogFile')) {
		return new File(project.property('changelogFile').toString()).text
	}
	return project.findProperty('changelog')
}

tasks.register('requireSigningKeyForDevBuild') {
	group = 'mellooessentials'
	description = 'Fails the build if attempting a "dev" build (no -PtestBuild) without the maintainer\'s own signing key present.'
	doLast {
		if (project.hasProperty('testBuild')) {
			return
		}
		def keyFile = new File(System.getProperty("user.home"), ".mellooessentials-signing/private_key.pem")
		if (!keyFile.exists()) {
			throw new GradleException(
				"Can't build \"dev\" - that requires the maintainer's own signing key, which isn't on this " +
				"machine. Add -PtestBuild instead (e.g. ./gradlew build -PtestBuild=true, or node scripts/build.js) - " +
				"a test build needs no key or verification at all."
			)
		}
	}
}

tasks.register('requireChangelog') {
	group = 'mellooessentials'
	description = 'Fails the build if no changelog was provided via -Pchangelog or -PchangelogFile (skipped entirely for -PtestBuild builds).'
	dependsOn tasks.named('requireSigningKeyForDevBuild')
	doLast {
		if (project.hasProperty('testBuild')) {
			return
		}
		def text = resolveChangelogText()
		if (!text || text.toString().trim().isEmpty()) {
			throw new GradleException(
				"Missing changelog! Every build must include one now - run with " +
				"-PchangelogFile=path/to/changelog.txt (recommended) or -Pchangelog=\"short one-liner\"."
			)
		}
	}
}

tasks.register('signAndRegisterBuild', Exec) {
	group = 'mellooessentials'
	description = 'Signs this build\'s own class hash with the local private key and registers it as a trusted release, with its changelog (never fails the build over network/IO issues, but requires -Pchangelog). Skipped entirely for -PtestBuild builds.'
	dependsOn tasks.named('jar'), tasks.named('requireChangelog')
	ignoreExitValue = true
	onlyIf { !project.hasProperty('testBuild') }
	environment 'SKYMELLOO_SITE_URL', siteUrl
	doFirst {
		def text = resolveChangelogText()
		def tmpFile = new File("${buildDir}/changelog-arg.txt")
		tmpFile.parentFile.mkdirs()
		tmpFile.text = text.toString()
		commandLine 'java', "${projectDir}/scripts/SignAndRegister.java", project.version.toString(), tasks.named('jar').get().archiveFile.get().asFile.absolutePath, tmpFile.absolutePath
	}
}

tasks.register('reportBuild', Exec) {
	group = 'mellooessentials'
	description = 'Reports this build\'s version + jar hash to sky.melloo.me (informational, never fails the build).'
	dependsOn tasks.named('jar')
	ignoreExitValue = true
	environment 'SKYMELLOO_SITE_URL', siteUrl
	commandLine 'node', "${projectDir}/scripts/report-build.js", project.version.toString(), tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

tasks.register('uploadJar', Exec) {
	group = 'mellooessentials'
	description = 'Uploads this build\'s jar to sky.melloo.me for admin download (never fails the build).'
	dependsOn tasks.named('jar')
	ignoreExitValue = true
	environment 'SKYMELLOO_SITE_URL', siteUrl
	commandLine 'node', "${projectDir}/scripts/upload-jar.js", project.version.toString(), tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

// gradle.properties is committed, so whatever site_url says there is what everyone who downloads a
// release gets - it has to stay production. Per-build targets belong on the command line
// (-PsiteUrl=...) or in ~/.gradle/gradle.properties, neither of which is in this repo.
tasks.register('requireProductionSiteInRepo') {
	group = 'mellooessentials'
	description = 'Fails the build if the committed site_url has been pointed away from production.'
	doLast {
		def committed = project.site_url.toString().replaceAll('/+$', '')
		if (committed != productionUrl) {
			throw new GradleException(
				"site_url in gradle.properties is \"${committed}\", but that file is committed and decides where " +
				"everyone else's download points. Set it back to ${productionUrl} and pass your own target per " +
				"build instead: ./gradlew build -PsiteUrl=${committed}"
			)
		}
	}
}

tasks.named('processResources') {
	dependsOn tasks.named('requireProductionSiteInRepo')
	doLast {
		if (siteUrl != productionUrl) {
			logger.lifecycle("[site] This build targets ${siteUrl}, not production - it registers there and must not be shared.")
		}
	}
}

tasks.named('build') {
	finalizedBy tasks.named('reportBuild')
	finalizedBy tasks.named('signAndRegisterBuild')
	finalizedBy tasks.named('uploadJar')
}

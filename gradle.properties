org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties - kept in lockstep with the same Minecraft/Loader/Loom/Fabric API versions as
# the SkyMelloo project, since this was split off from it.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Versioning scheme, same discipline and starting point as skymelloo (kept as a fully separate
# counter - this mod's mod_version has nothing to do with skymelloo's own numbers): PATCH (3rd
# number) for small changes, MINOR (2nd number, patch reset to 0) for bigger features, MAJOR only
# on explicit instruction. public_version is a separate, hand-maintained user-facing release
# number, only bumped when a build is actually promoted to public via the sky.melloo.me admin
# panel. Only bump mod_version for a change that actually affects the built jar - not for
# repo-only files that never ship (README, CHANGELOG, CODE_OF_CONDUCT, .github/*, etc.). Full
# version history: see CHANGELOG.md - this file never holds changelog text, only the current
# version number.
mod_version=0.14.0
public_version=0.0.1

# Which deployment the built jar talks to, and which one its build/signature is registered against.
# ALWAYS production here - this value is committed, so it is what everyone who downloads a release
# gets. To point a build at your own server instead, pass -PsiteUrl=https://dev3-sky.melloo.me on
# the command line, or set siteUrl in ~/.gradle/gradle.properties - neither lives in this repo, so a
# dev target can't be committed by accident. A build with a non-production siteUrl registers on that
# server, never on production, so it can never be promoted to a public release.
site_url=https://sky.melloo.me

maven_group=com.melloo.mellooessentials
archives_base_name=mellooessentials
fabric_api_version=0.155.2+26.1.2
hypixel_modapi_version=1.0.2

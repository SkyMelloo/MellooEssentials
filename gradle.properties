org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties - kept in lockstep with the same Minecraft/Loader/Loom/Fabric API versions as
# the SkyMelloo project, since this was split off from it.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Versioning scheme, same discipline and starting point as skymelloo (kept as a fully separate
# counter - this mod's mod_version has nothing to do with skymelloo's own numbers): mod_version below
# is the INTERNAL/dev version, bumped on every single change so every build has a unique,
# distinguishable identity - without this, "is the jar I installed actually the latest build" is
# impossible to answer just by looking at it, which is exactly the confusion that prompted adding
# this scheme. PATCH (3rd number) for small changes, MINOR (2nd number, patch reset to 0) for bigger
# features, MAJOR only on explicit instruction. public_version is a separate, hand-maintained
# user-facing release number, only bumped when a build is actually promoted to public via the
# sky.melloo.me admin panel.
# Bumped 0.0.0 -> 0.1.0 (minor, not patch) - same reasoning skymelloo's own first bump used: a real
# batch of features had already shipped while this sat at a single unbumped version the whole time
# (the mod-user marker system and its tab-list counterpart), discovered only once this versioning
# scheme itself was being added - so the correction covers all of it at once.
# Bumped 0.1.0 -> 0.1.1 (patch): added a one-time chat diagnostic to MellooEssentialsClient's tick
# loop (isModUser(self) reported on join) to track down a live report that the mod-user marker isn't
# showing on the local player's own nametag/tab row at all, in code that otherwise looks correct on
# inspection. Temporary - remove once the actual root cause is found.
# Bumped 0.1.1 -> 0.1.2 (patch): removed the diagnostic chat message again - the "marker missing" report
# turned out to be because the jars were never in the Lunar profile actually being tested (skyblock-3),
# not a real bug, so there was nothing left to diagnose. Also removed the space between the marker
# sprite and the player name (ModMarkerManager#apply) - the name now sits directly against the icon.
# Bumped 0.1.2 -> 0.1.3 (patch): flush-against-the-icon read as too tight - added back a thin space
# (U+2009), narrower than the original regular space.
# Bumped 0.1.3 -> 0.1.4 (patch): SettingsScreen gained a second constructor (openToCosmetics) so
# SkyMelloo's own menu can open straight to the Cosmetics tab here instead of maintaining a second,
# duplicate cosmetics UI of its own.
# Bumped 0.1.4 -> 0.2.0 (minor, not patch): real new feature batch - PlayerInfoHud and the new
# ConnectionStatusHud (a "Connected to sky.melloo.me, for Xm Ys" indicator, ticking duration via
# ModAuthManager's new connection-state tracking) both gained real X/Y position config, draggable via
# SkyMelloo's own HUD layout editor when it's installed (this mod has no positioning UI of its own).
# Also: the H keybind now defers to SkyMelloo's own settings screen when SkyMelloo is installed
# (they collided on the same default key), with a new "SkyMelloo Config" button on this screen as the
# way back, via a new SettingsScreen.setSkyMellooScreenOpener extension point SkyMelloo registers into.
# Bumped 0.2.0 -> 0.3.0 (minor): reversed the H-key deferral above - H now ALWAYS opens this mod's
# settings screen unconditionally, even with SkyMelloo installed (SkyMelloo's own H binding was
# removed instead, now unbound by default - one settings surface, no more race). ConnectionStatusHud
# gained two extension points (setAdminBadgeSupplier, setExtraLineProvider) so SkyMelloo's admin
# badge and sky.melloo.me ping reading still show up in this mod's single status box, since
# SkyMelloo's own former status/player-info HUDs (byte-for-byte duplicates of this mod's) were
# removed on its side. Added the missing "Connection Status HUD" toggle checkbox to the General tab
# (the config field already existed, the checkbox itself never did).
# Bumped 0.3.0 -> 0.3.1 (patch): ConnectionStatusHud redesigned to a fixed, always-exactly-2-line
# layout (bold headline + one combined detail line, instead of up to 3 separately stacked lines) with
# a glowing status dot and a colored accent stripe down the panel's left edge. setExtraLineProvider's
# contract changed slightly - it now supplies a short fragment appended to the detail line (e.g.
# "42ms"), not a whole separate line already prefixed with "sky.melloo.me" (SkyMelloo's own
# registration updated to match).
# Bumped 0.3.1 -> 0.3.2 (patch): ConnectionStatusHud's status dot is now a real circle (scanline-filled,
# not a flat square) that gently pulses in size on a 2s cycle, moved to sit directly in front of the
# "Connected" headline text itself instead of centered in a gutter spanning both text lines.
# Bumped 0.3.2 -> 0.4.0 (minor): took over full ownership of staff/party glow highlighting (SkyMelloo's
# old duplicate STAFF branch was racing this mod's own mixin for the same vanilla methods - retired on
# SkyMelloo's side). Moved the entire Friends system (friend list, relay chat, the Social menu/key G)
# and the "encountered staff" tracker/command here from SkyMelloo - new ApiClient friend/relay/
# staff-encounter methods (same server routes, zero backend changes), new ChatUtil, new SocialMenuScreen
# (Friends only - the old Party column stayed SkyMelloo-only, it already has its own passive Party HUD
# and commands for that). New /mellooessentials + /me command tree (friend, chat, hitstaff, help).
# PlayerTabOverlayMixin gained throttled diagnostic logging for a live report that the tab-list marker
# doesn't show on some clients - no functional change, chasing a bug that reads correctly in source.
# Bumped 0.4.0 -> 0.4.1 (patch): fabric.mod.json's depends block now actually includes Skyblocker
# (matches what sky.melloo.me's download page already claimed as required - manifest was out of sync
# with reality). Also fixed the homepage contact field, which still pointed at the old /mellooessentials
# URL instead of /download.
# Bumped 0.4.1 -> 0.4.2 (patch): real bug fix - the mod-user marker's pink-vs-light-blue choice was
# backwards from either side (a MellooEssentials-only player always looked pink to a SkyMelloo client,
# a real SkyMelloo user always looked light-blue to an Essentials-only client), because both mods
# report presence to the same /presence endpoint and "is a mod user" alone can't distinguish which mod
# a given uuid is running. PresenceManager now tracks a new isSkyMelloo(uuid) signal (server-resolved
# from which mod's client header showed up on that uuid's last presence report - needs a matching
# server-side change, see the site's own changelog) and both marker mixins use it directly. Removed
# ModMarkerManager's now-unnecessary/buggy setSpriteOverride hook entirely (SkyMelloo's side removed
# to match).
# Bumped 0.4.2 -> 0.4.3 (patch): ConnectionStatusHud's status dot - live report that it looked barely
# round and its halo nearly touched both the accent stripe and the text at peak pulse size. Bumped the
# radii up (5-7/3-4, was 4-6/2-3 - larger radii approximate a circle more smoothly via fillCircle's
# scanlines) and widened the text gutter from 10px to 20px for real clearance on both sides.
# Bumped 0.4.3 -> 0.4.4 (patch): real bugfix - Skyblocker was wrongly listed as a required dependency
# here (added by mistake for T2). This mod has no Skyblocker integration at all - that's SkyMelloo's
# own SkyblockerBridge. Removed from fabric.mod.json's depends block; SkyMelloo's own manifest gained
# it instead.
# Bumped 0.4.4 -> 0.4.5 (minor bugfix batch, kept as patch): suggestOnlinePlayers now filters out
# Hypixel NPCs (names starting with "!") and the local player's own name, and merges in the last 10
# usernames actually typed into a friend/chat command (new RecentUsernames, session-only) so someone
# who just logged off is still one tab-complete away. The "/me chat <name>" argument also gained
# suggestions for the first time (off the friends list, since sendDirect requires one anyway).
# Bumped 0.4.5 -> 0.4.6 (minor, not patch): the HUD layout editor (key J) moved here from SkyMelloo
# entirely - real bugfix, it didn't work at all when only this mod was installed (no J-menu of its
# own existed). Now unconditionally bound here (same "always bind" pattern as G/H), natively covering
# the two elements this mod renders (Connection Status, Player Info) - new
# HudLayoutEditorScreen#setExtraElementsProvider/setExtraSaveHandler let SkyMelloo supply its own
# elements (Fishing Combo, Party, Dungeon Score, etc.) without this mod needing to know it exists.
# Bumped 0.4.6 -> 0.5.0 (minor): took over full ownership of the party block/kick system, moved here
# from SkyMelloo as a generic, extensible primitive any mod can build on - new
# party.BlockedUsersManager (personal client-side block list, file-persisted, /me block <name>/unblock
# <name>) and new party.PartyKickQueue (the join-time chat prompt with [Kick]/[Block] buttons, the
# cooldown-aware kick queue, and a new setExtraJoinAction extension point for other mods to append to
# the join line). HighlightManager gained setPartyBlinkColorOverride so SkyMelloo's low-HP party blink
# survives the consolidation - a narrow color-value callback, not a second glow-decision system (same
# race SkyMelloo's old duplicate STAFF branch had). Also: colorizeName's party/friend name suffix is
# now a real heart icon (vanilla's own HUD heart sprite, tinted to the category color) instead of the
# small "♥" text glyph.
# Bumped 0.5.0 -> 0.5.1 (patch): the main menu's rotating panorama is now replaced with a static
# custom background image (new TitleBackgroundMixin into vanilla TitleScreen#extractBackground,
# stretched full-screen via GuiGraphicsExtractor#blit) - a user-supplied screenshot, packaged at
# assets/mellooessentials/textures/gui/title_background.png, downscaled to 800px wide to keep the jar
# small (a 3840x2160 source made the jar too big for sky.melloo.me's upload limit - hit a real 413 on
# the first attempt at 1920px).
# Bumped 0.5.1 -> 0.6.0 (minor): new Cloud Sync for this mod's own settings (HUD positions,
# cosmetics) - real bug report: HUD element positions set in one Lunar Client profile never showed
# up in another, because each profile has its own separate config file on disk; a shared-disk-path
# fix was rejected in favor of a real account-based sync, same architecture as SkyMelloo's own
# CloudSyncManager (cloud unconditionally authoritative on join, no timestamp/diff comparison - see
# its own doc comment for the full reasoning history). New EssentialsConfig#cloudSyncEnabled (on by
# default), new ApiClient#fetchPermissions/fetchCloudSettings/pushCloudSettings hitting the same
# /mod/settings and /mod/permissions routes SkyMelloo already uses - the server already tells the two
# mods' presence reports apart by request header, so /mod/settings needs the same per-mod namespacing
# server-side before this can actually round-trip without colliding with SkyMelloo's own cloud data
# (filed as a task for the website session). New "Cloud" tab in SettingsScreen (toggle + Push Now/Pull
# Now), pushes on SettingsScreen/HudLayoutEditorScreen close, pulls once per launch on join.
# Bumped 0.6.0 -> 0.7.0 (minor): new /me verify <code>, moved here from SkyMelloo's own
# "/skymelloo verify" - the admin account-linking flow. The server-side check (/mod/verify) was
# already mod-agnostic (any mod's valid signature works), so this was purely a client-side command
# registration move - SkyMelloo hard-depends on this mod already, no reason to keep a duplicate.
# Bumped 0.7.0 -> 0.8.0 (minor): Friend Highlighting moved here from SkyMelloo, completing the same
# consolidation staff/party already went through (a duplicate-mixin race between the two mods' glow
# decisions, one deciding, one always losing). New EssentialsConfig#friendHighlightEnabled/
# friendHighlightColor/friendGlowOutlineEnabled (friend stays user-configurable, unlike staff/party's
# fixed colors - "which color represents MY friends to ME" is a personal preference, not a shared
# fact). New "Friend Highlighting" row in the General tab opening a new HighlightColorScreen popup
# (enabled/outline toggles + a 16-color grid, no particle-kind concept - not a cosmetic effect).
# HighlightManager#getFixedColor/colorizeTabListName now also take a username (needed for the friend
# check in the Tab-list path, which only had a uuid before).
# Bumped 0.8.0 -> 0.8.1 (patch): comment/README cleanup pass - trimmed long comments that narrated
# implementation history/past bugs down to 1-2 lines of current behavior, and shortened the README's
# Features/Build sections. No functional change.
# Bumped 0.8.1 -> 0.8.2 (patch): README Building section trimmed further - removed maintainer-only
# release-process details (admin panel promotion, reportBuild/uploadJar, tokens), added the
# previously-undocumented node scripts/build.js helper script. No functional change.
# Bumped 0.8.2 -> 0.8.3 (patch): dead-code sweep (T16) - removed 2 confirmed-unused public methods
# (MellooEssentialsClient#getOpenSettingsKey, FriendsManager#findFriend), each verified with a
# repo-wide grep before removal. Kept PartyKickQueue#setExtraJoinAction (a documented, intentional
# extension point, not leftover cruft). Same-named classes shared with SkyMelloo (ChatUtil/
# PartyTracker/etc.) were checked and confirmed intentionally divergent, not duplicates - left
# untouched. No functional change.
# Bumped 0.8.3 -> 0.8.4 (patch): i18n sweep - every hardcoded chat/command/GUI/HUD string now routes
# through Component.translatable (new Lang util) with the English text moved into en_us.json, instead
# of Component.literal/raw String. No functional or visual change.
# Bumped 0.8.4 -> 0.8.5 (patch): migrated every ApiClient call from the internal /api/mod/* path to
# the versioned public /api/public/mod/v1/* surface (see DEVELOPER_API.md) - the internal path is now
# official-mod-only. Signing unchanged (still Ed25519), only the base URL and signed path prefix
# moved. No behavior/response-shape change otherwise.
# Bumped 0.8.5 -> 0.9.0 (minor, not patch): this mod's PresenceManager is now the single presence
# report/query loop for both mods, with real data it never sent before - accountLinked (new
# AccountLinkStatus, polls /permissions), afk (AfkDetector, moved from SkyMelloo), and location
# (already-tracked HypixelLocationTracker data, just never wired into the report). Previously this
# mod's own report always sent empty status/afk/accountLinked and no location at all, which - since
# SkyMelloo ran a SECOND independent report loop against the exact same endpoint - meant this mod's
# own report silently overwrote SkyMelloo's richer data with those empty defaults on every tick,
# a real data-corruption race, not just a missing-feature gap. New extension points
# (setStatusTextSupplier/setDungeonSyncSupplier/setExtraCosmeticsSupplier/setDungeonSyncListener/
# setReportCompletionListener) let SkyMelloo contribute its own data into this single report/query
# cycle instead of running a duplicate one.
# Bumped 0.9.0 -> 0.9.1 (patch): comment cleanup - trimmed several long doc comments down to 1-2
# lines. No functional change.
mod_version=0.9.1
public_version=0.0.1
maven_group=com.melloo.mellooessentials
archives_base_name=mellooessentials
fabric_api_version=0.155.2+26.1.2
hypixel_modapi_version=1.0.2
